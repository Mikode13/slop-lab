name: AI Review

# Canary caller of the reusable reviewer in Mikode13/.github. slop-lab runs a newer revision than
# the other repositories, so a reviewer change is proven here on real pull requests before they
# move their pin. The pin is a full commit SHA; rolling back is moving it to the previous one.
#
# pull_request_target runs this file as it is on main, never as the pull request defines it, and
# only a run from main can read the ai-review environment that holds the provider token.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    uses: Mikode13/.github/.github/workflows/ai-review.yml@b01042a6dfed2c4f8781a387395c6fdd467f17b1
